<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据结构总习题集 - 扫码刷题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background: linear-gradient(135deg, #0891b2 0%, #06b6d4 50%, #22d3ee 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
}
.card{
  background:#fff;border-radius:24px;padding:32px 24px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.15);max-width:420px;width:90%;
}
h1{font-size:1.4rem;color:#0f172a;margin-bottom:6px}
.desc{font-size:0.85rem;color:#64748b;margin-bottom:20px}
.qr-wrap{
  background:#f8fafc;border-radius:16px;padding:16px;display:inline-block;
  border:2px dashed #e2e8f0;
}
.qr-wrap img{width:240px;height:240px;display:block}
.url{
  margin-top:16px;background:#f1f5f9;padding:10px 16px;border-radius:12px;
  font-size:0.78rem;color:#334155;word-break:break-all;font-family:monospace;
}
.btn{
  display:inline-block;margin-top:16px;padding:12px 28px;border-radius:25px;
  background:#0891b2;color:#fff;text-decoration:none;font-size:0.9rem;font-weight:600;
}
.btn:active{opacity:0.85}
.hint{margin-top:14px;font-size:0.72rem;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <h1>📊 数据结构总习题集</h1>
  <div class="desc">457题 · 单选/多选/判断/填空/简答/图示 · 错题本</div>
  <div class="qr-wrap">
    <img src="二维码-数据结构总习题集.png" alt="扫码刷题二维码">
  </div>
  <div class="url">https://bb3531.github.io/data-structure-quiz/</div>
  <a class="btn" href="https://bb3531.github.io/data-structure-quiz/" target="_blank">🖥️ 电脑浏览器打开</a>
  <div class="hint">📱 用微信「扫一扫」识别上方二维码即可刷题</div>
</div>
</body>
</html>
