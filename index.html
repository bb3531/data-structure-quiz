<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>数据结构总习题集 · 457题</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="数据结构总习题集">
<meta name="theme-color" content="#0891b2">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --primary: #0891b2;
  --primary-light: #ecfeff;
  --success: #059669;
  --success-light: #ecfdf5;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --text: #1e293b;
  --text2: #64748b;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --radius: 16px;
  --radius-sm: 10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);min-height:100vh;min-height:100dvh;padding-bottom:100px;
  -webkit-user-select:none;user-select:none;
}

/* Top bar */
.topbar{
  background:var(--card);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap;
}
.topbar .logo{font-size:0.95rem;font-weight:700;color:var(--primary);white-space:nowrap}
.topbar .progress-wrap{flex:1;min-width:60px;max-width:180px}
.topbar .progress-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:2px}
.topbar .progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width 0.3s}
.topbar .progress-text{font-size:0.6rem;color:var(--text2);text-align:right}

/* Type tabs */
.type-tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:20px;padding:3px}
.type-tab{padding:5px 10px;border-radius:16px;border:none;font-size:0.62rem;font-weight:600;cursor:pointer;background:transparent;color:var(--text2);white-space:nowrap;transition:all 0.15s}
.type-tab.on{background:var(--primary);color:#fff}
.type-tab .cnt{font-weight:400;opacity:0.7}

/* Main */
.main{padding:10px;max-width:650px;margin:0 auto}

/* Card */
.card{
  background:var(--card);border-radius:20px;padding:18px 14px;margin-bottom:10px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}

/* Question header */
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.q-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:var(--primary);
  color:#fff;font-size:0.75rem;font-weight:700;flex-shrink:0;
}
.q-tag{font-size:0.6rem;padding:3px 10px;border-radius:12px;font-weight:600}
.q-tag.single{background:#e0f2fe;color:#0369a1}
.q-tag.multi{background:#fef3c7;color:#92400e}
.q-tag.judge{background:#dcfce7;color:#16a34a}
.q-tag.short{background:#fce7f3;color:#be185d}
.q-tag.blank{background:#e0e7ff;color:#4338ca}
.q-tag.diagram{background:#cffafe;color:#0e7490}

/* Question stem */
.q-stem{
  font-size:0.88rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  background:#fafbfc;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);
}

/* Options */
.options{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  border:2px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:all 0.15s;background:#fff;font-size:0.84rem;line-height:1.5;
}
.opt:active{transform:scale(0.98)}
.opt .opt-letter{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:0.73rem;flex-shrink:0;transition:all 0.15s;
}
.opt .opt-text{flex:1;padding-top:2px}
.opt:hover{border-color:var(--primary);background:var(--primary-light)}
.opt:hover .opt-letter{border-color:var(--primary);color:var(--primary)}
.opt.selected{border-color:var(--primary);background:var(--primary-light)}
.opt.selected .opt-letter{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.correct{border-color:var(--success);background:var(--success-light)}
.opt.correct .opt-letter{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:var(--danger-light)}
.opt.wrong .opt-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.disabled{pointer-events:none;opacity:0.85}

/* Multi-select indicators */
.opt.multi-selected::after{
  content:'✓';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--primary);font-weight:700;font-size:1.1rem;
}

/* Result banner */
.banner{display:none;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:600;font-size:0.8rem}
.banner.show{display:flex}
.banner.ok{background:var(--success-light);color:var(--success)}
.banner.er{background:var(--danger-light);color:var(--danger)}
.banner.info{background:var(--primary-light);color:var(--primary)}

/* Explanation */
.explanation{
  margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--warning-light);border:1px solid #fde68a;
  font-size:0.78rem;line-height:1.6;display:none;
}
.explanation.show{display:block}
.explanation .exp-title{font-weight:700;color:#92400e;margin-bottom:4px}
.explanation .exp-content{color:#78350f;white-space:pre-wrap}

/* Short answer area */
.short-answer-area{margin-top:12px}
.short-answer-area textarea{
  width:100%;min-height:80px;padding:12px;border-radius:12px;
  border:2px solid var(--border);font-size:0.84rem;line-height:1.6;
  font-family:inherit;resize:vertical;outline:none;
}
.short-answer-area textarea:focus{border-color:var(--primary)}
.short-answer-toggle{
  margin-top:10px;width:100%;padding:12px;border-radius:25px;
  border:none;background:var(--primary-light);color:var(--primary);
  font-size:0.84rem;font-weight:600;cursor:pointer;
}
.short-answer-toggle:active{opacity:0.8}

/* Bottom bar */
.bottombar{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border);padding:10px 14px;
  display:flex;gap:10px;align-items:center;z-index:100;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
.bottombar .btn{
  flex:1;padding:12px;border-radius:25px;border:none;font-size:0.84rem;
  font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.bottombar .btn:active{transform:scale(0.96)}
.btn-prev{background:var(--bg);color:var(--text)}
.btn-check{background:var(--primary);color:#fff}
.btn-next{background:var(--primary);color:#fff}
.btn-reset{background:var(--danger-light);color:var(--danger);font-size:0.78rem}
.btn-star{background:var(--warning-light);color:#92400e;font-size:0.78rem;flex:0.5}

/* Nav dots / grid */
.nav-dots{
  display:flex;gap:3px;overflow-x:auto;padding:8px 0;justify-content:flex-start;flex-wrap:wrap;
  max-height:120px;overflow-y:auto;
}
.nav-dot{
  width:22px;height:22px;border-radius:4px;background:var(--border);flex-shrink:0;
  cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;
  font-size:0.55rem;font-weight:700;color:var(--text2);
}
.nav-dot.active{background:var(--primary);color:#fff;width:28px}
.nav-dot.done{background:var(--success);color:#fff}
.nav-dot.wrong{background:var(--danger);color:#fff}
.nav-dot.starred{border:2px solid var(--warning)}

/* Score card */
.score-card{text-align:center;padding:24px 16px}
.score-circle{
  width:100px;height:100px;border-radius:50%;margin:0 auto 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:5px solid var(--primary);
}
.score-circle .score-num{font-size:2rem;font-weight:800;color:var(--primary)}
.score-circle .score-total{font-size:0.8rem;color:var(--text2)}
.score-detail{font-size:0.85rem;color:var(--text2);line-height:1.8}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-card .stat-val{font-size:1.5rem;font-weight:800}
.stat-card .stat-lbl{font-size:0.65rem;color:var(--text2);margin-top:2px}

/* Filter chips */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{padding:5px 10px;border-radius:14px;border:1px solid var(--border);font-size:0.65rem;font-weight:600;cursor:pointer;background:#fff;color:var(--text2);transition:all 0.15s}
.filter-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Toast */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);
  background:rgba(0,0,0,0.82);color:#fff;padding:8px 20px;border-radius:20px;
  font-size:0.8rem;font-weight:600;z-index:999;pointer-events:none;opacity:0;transition:all 0.2s;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Search */
.search-wrap{padding:0 0 10px 0}
.search-input{
  width:100%;padding:10px 14px;border-radius:25px;border:2px solid var(--border);
  font-size:0.82rem;outline:none;background:var(--card);transition:all 0.15s;
}
.search-input:focus{border-color:var(--primary)}

/* Question list for quick nav */
.qlist-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
  cursor:pointer;font-size:0.78rem;transition:all 0.1s;
}
.qlist-item:hover{background:var(--primary-light)}
.qlist-item .ql-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.65rem;background:var(--border);color:var(--text2);flex-shrink:0}
.qlist-item .ql-num.done{background:var(--success);color:#fff}
.qlist-item .ql-stem{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}

/* Error book & data panel */
.data-panel{
  background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;
  box-shadow:var(--shadow);display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.data-panel .dp-stat{
  font-size:0.68rem;color:var(--text2);padding:4px 8px;background:var(--bg);
  border-radius:10px;display:flex;align-items:center;gap:4px;
}
.data-panel .dp-stat .dp-num{font-weight:700;color:var(--primary)}
.data-panel .dp-stat.err .dp-num{color:var(--danger)}
.data-panel .dp-btn{
  padding:5px 10px;border-radius:12px;border:1px solid var(--border);
  font-size:0.62rem;font-weight:600;cursor:pointer;background:#fff;color:var(--text2);
  white-space:nowrap;transition:all 0.1s;
}
.data-panel .dp-btn:active{transform:scale(0.95)}
.data-panel .dp-btn.danger{color:var(--danger);border-color:var(--danger-light)}
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);
  z-index:200;display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:var(--card);border-radius:20px;padding:24px 20px;max-width:360px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.modal-box h3{font-size:1rem;margin-bottom:8px}
.modal-box p{font-size:0.8rem;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal-box .modal-btns{display:flex;gap:8px}
.modal-box .modal-btn{
  flex:1;padding:10px;border-radius:20px;border:none;font-size:0.82rem;
  font-weight:600;cursor:pointer;
}
.modal-box .modal-btn.primary{background:var(--primary);color:#fff}
.modal-box .modal-btn.danger{background:var(--danger-light);color:var(--danger)}
.modal-box .modal-btn.cancel{background:var(--bg);color:var(--text)}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">📊 数据结构总习题集</span>
  <div class="type-tabs" id="typeTabs">
    <button class="type-tab on" data-type="all">全部<span class="cnt">457</span></button>
    <button class="type-tab" data-type="single">单选<span class="cnt">143</span></button>
    <button class="type-tab" data-type="multi">多选<span class="cnt">32</span></button>
    <button class="type-tab" data-type="judge">判断<span class="cnt">110</span></button>
    <button class="type-tab" data-type="blank">填空<span class="cnt">148</span></button>
    <button class="type-tab" data-type="short">简答<span class="cnt">15</span></button>
    <button class="type-tab" data-type="diagram">图示<span class="cnt">9</span></button>
    <button class="type-tab error-tab" data-type="wrong" style="color:#dc2626">错题<span class="cnt" id="wrongCount">0</span></button>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0/457</div>
  </div>
</div>

<div class="main">
  <!-- Search -->
  <div class="search-wrap">
    <input class="search-input" type="text" id="searchInput" placeholder="🔍 搜索题目关键词...">
  </div>

  <!-- Data panel -->
  <div class="data-panel" id="dataPanel">
    <div class="dp-stat"><span>📊</span> <span>已答</span><span class="dp-num" id="dpAnswered">0</span></div>
    <div class="dp-stat"><span>✅</span> <span>正确</span><span class="dp-num" id="dpCorrect">0</span></div>
    <div class="dp-stat err"><span>❌</span> <span>错题</span><span class="dp-num" id="dpWrong">0</span></div>
    <div class="dp-stat"><span>⭐</span> <span>收藏</span><span class="dp-num" id="dpStarred">0</span></div>
    <button class="dp-btn" onclick="exportData()" title="导出刷题数据">📤 导出</button>
    <button class="dp-btn" onclick="document.getElementById('importFile').click()" title="导入刷题数据">📥 导入</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    <button class="dp-btn" onclick="shuffleQuestions()" title="随机打乱题目顺序">🔀 打乱</button>
    <button class="dp-btn danger" onclick="showResetModal()" title="清除所有数据">🔄 重置</button>
  </div>

  <!-- Question card -->
  <div class="card" id="questionCard">
    <div class="q-header">
      <span class="q-num" id="qNum">1</span>
      <span class="q-tag single" id="qTag">单选题</span>
    </div>
    <div class="q-stem" id="qStem"></div>
    <div class="options" id="qOptions"></div>
    <div class="short-answer-area" id="qShortAnswer" style="display:none">
      <textarea placeholder="在此输入你的答案..."></textarea>
      <button class="short-answer-toggle" onclick="toggleShortAnswer()">📖 显示参考答案</button>
      <div class="explanation" id="shortAnswerExp">
        <div class="exp-title">📝 参考答案：</div>
        <div class="exp-content" id="shortAnswerContent"></div>
      </div>
    </div>
    <div class="banner" id="qBanner"></div>
    <div class="explanation" id="qExplanation">
      <div class="exp-title">💡 解析：</div>
      <div class="exp-content" id="qExplanationContent"></div>
    </div>
  </div>

  <!-- Quick nav grid -->
  <div class="card" style="padding:12px">
    <div style="font-size:0.7rem;font-weight:600;color:var(--text2);margin-bottom:6px">📋 快速跳转</div>
    <div class="nav-dots" id="navDots"></div>
  </div>
</div>

<div class="bottombar">
  <button class="btn btn-star" id="btnStar" onclick="toggleStar()">⭐ 收藏</button>
  <button class="btn btn-prev" onclick="prevQuestion()">◀ 上一题</button>
  <button class="btn btn-check" id="btnCheck" onclick="checkAnswer()">✓ 确认</button>
  <button class="btn btn-next" onclick="nextQuestion()">下一题 ▶</button>
</div>

<div class="toast" id="toast"></div>

<!-- Reset modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <h3>🔄 重置所有数据？</h3>
    <p>这将清除所有答题记录、错题和收藏。此操作不可撤销。</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="hideResetModal()">取消</button>
      <button class="modal-btn danger" onclick="resetAllData()">确认重置</button>
    </div>
  </div>
</div>

// ========== APP STATE ==========
let currentIndex = 0;

const SELF_TYPES = new Set(['short','blank','diagram']);
function isSelf(t){ return SELF_TYPES.has(t); }
let currentFilter = 'all';
let filteredQuestions = [...ALL_QUESTIONS];
let userAnswers = {}; // {globalId: answer}
let wrongSet = new Set(); // globalIds of wrong answers
let starredQuestions = new Set();
let showAnswers = {}; // {globalId: true} whether answer has been revealed

// Load saved state
try {
  const saved = JSON.parse(localStorage.getItem('ds_quiz_state') || '{}');
  if (saved.userAnswers) userAnswers = saved.userAnswers;
  if (saved.wrongSet) wrongSet = new Set(saved.wrongSet);
  if (saved.starred) starredQuestions = new Set(saved.starred);
  if (saved.currentIndex !== undefined) currentIndex = saved.currentIndex;
  if (saved.currentFilter) currentFilter = saved.currentFilter;
} catch(e) {}

function updateDataPanel() {
  const total = ALL_QUESTIONS.length;
  const answered = Object.keys(userAnswers).length;
  let correct = 0;
  ALL_QUESTIONS.forEach(q => {
    if (q.answer && userAnswers[q.globalId] === q.answer) correct++;
  });
  const wrong = wrongSet.size;
  const starred = starredQuestions.size;

  document.getElementById('dpAnswered').textContent = answered;
  document.getElementById('dpCorrect').textContent = correct;
  document.getElementById('dpWrong').textContent = wrong;
  document.getElementById('dpStarred').textContent = starred;
  document.getElementById('wrongCount').textContent = wrong;
}

// ========== FILTERING ==========
function applyFilter(type) {
  currentFilter = type;
  const base = currentFilter === 'all' ? ALL_QUESTIONS :
    currentFilter === 'wrong' ? ALL_QUESTIONS :
    ALL_QUESTIONS.filter(q => q.type === currentFilter);

  if (type === 'wrong') {
    filteredQuestions = base.filter(q => wrongSet.has(q.globalId));
  } else {
    filteredQuestions = [...base];
  }

  currentIndex = Math.min(currentIndex, Math.max(0, filteredQuestions.length - 1));
  if (filteredQuestions.length === 0) currentIndex = 0;

  // Update type tab styles
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('on'));
  const activeTab = document.querySelector('.type-tab[data-type="' + type + '"]');
  if (activeTab) activeTab.classList.add('on');

  renderQuestion();
  renderNavDots();
  updateProgress();
  saveState();
}

// Search
document.getElementById('searchInput').addEventListener('input', function(e) {
  const term = e.target.value.trim().toLowerCase();
  if (!term) {
    applyFilter(currentFilter);
    return;
  }
  const base = currentFilter === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.type === currentFilter);
  filteredQuestions = base.filter(q =>
    q.stem.toLowerCase().includes(term) ||
    q.options.some(o => o.toLowerCase().includes(term)) ||
    q.category.includes(term)
  );
  currentIndex = 0;
  renderQuestion();
  renderNavDots();
  updateProgress();
});

// Type tab clicks
document.getElementById('typeTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('type-tab')) {
    applyFilter(e.target.dataset.type);
  }
});

// ========== RENDER ==========
function renderQuestion() {
  if (filteredQuestions.length === 0) {
    document.getElementById('qStem').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text2)">没有匹配的题目</div>';
    document.getElementById('qOptions').innerHTML = '';
    document.getElementById('qShortAnswer').style.display = 'none';
    document.getElementById('qBanner').classList.remove('show');
    document.getElementById('qExplanation').classList.remove('show');
    return;
  }

  const q = filteredQuestions[Math.min(currentIndex, filteredQuestions.length - 1)];
  if (!q) return;

  // Update current index (in case of overflow)
  currentIndex = Math.min(currentIndex, filteredQuestions.length - 1);

  // Header
  document.getElementById('qNum').textContent = q.id;
  const tag = document.getElementById('qTag');
  tag.textContent = q.category;
  tag.className = 'q-tag ' + q.type;

  // Stem
  document.getElementById('qStem').textContent = q.stem;

  // Banner & explanation
  document.getElementById('qBanner').classList.remove('show', 'ok', 'er', 'info');
  document.getElementById('qExplanation').classList.remove('show');

  // Options
  const optsDiv = document.getElementById('qOptions');
  const shortDiv = document.getElementById('qShortAnswer');

  if (isSelf(q.type)) {
    optsDiv.innerHTML = '';
    shortDiv.style.display = 'block';
    shortDiv.querySelector('textarea').value = userAnswers[q.globalId] || '';
    document.getElementById('shortAnswerExp').classList.remove('show');
    document.getElementById('shortAnswerContent').textContent = q.answer || '暂无参考答案';
    document.getElementById('btnCheck').style.display = 'none';
    document.getElementById('qExplanation').classList.remove('show');
  } else {
    shortDiv.style.display = 'none';
    document.getElementById('btnCheck').style.display = '';

    const userAns = userAnswers[q.globalId];
    const answered = userAns !== undefined;
    const isCorrect = answered && q.answer && userAns === q.answer;
    const isWrong = answered && q.answer && userAns !== q.answer;
    const isSelfEval = answered && !q.answer;

    optsDiv.innerHTML = q.options.map((opt, i) => {
      const letter = 'ABCDEFGH'[i];
      let cls = 'opt';
      if (userAns && q.type === 'single' && letter === userAns) cls += ' selected';
      if (userAns && q.type === 'multi' && userAns.includes(letter)) cls += ' selected';
      if (answered && q.answer) {
        if ((q.type === 'single' ? (letter === q.answer) : q.answer.includes(letter))) cls += ' correct';
        else if (userAns && (q.type === 'single' ? (letter === userAns) : userAns.includes(letter)) && isWrong) cls += ' wrong';
      }
      if (answered) cls += ' disabled';
      return '<div class="' + cls + '" data-letter="' + letter + '" style="position:relative">' +
        '<span class="opt-letter">' + letter + '</span>' +
        '<span class="opt-text">' + opt + '</span>' +
        '</div>';
    }).join('');

    // Show banner
    if (isCorrect) {
      document.getElementById('qBanner').textContent = '✅ 回答正确！';
      document.getElementById('qBanner').classList.add('show', 'ok');
    } else if (isWrong) {
      document.getElementById('qBanner').textContent = '❌ 回答错误，正确答案是 ' + q.answer;
      document.getElementById('qBanner').classList.add('show', 'er');
    } else if (isSelfEval) {
      document.getElementById('qBanner').textContent = '📝 已作答（答案待验证）';
      document.getElementById('qBanner').classList.add('show', 'info');
    }

    // If answer was revealed/showAnswers
    if (showAnswers[q.globalId] && q.answer && !answered) {
      const correctOpt = optsDiv.querySelector('.opt[data-letter="' + q.answer + '"]');
      if (correctOpt) correctOpt.classList.add('correct');
    }
  }

  // Update star button
  document.getElementById('btnStar').textContent = starredQuestions.has(q.globalId) ? '⭐ 已收藏' : '☆ 收藏';

  renderNavDots();
  updateProgress();
}

function selectOption(letter) {
  const q = filteredQuestions[currentIndex];
  if (!q) return;
  if (isSelf(q.type)) return;

  const answered = userAnswers[q.globalId] !== undefined;
  if (answered) return; // Already answered

  if (q.type === 'multi') {
    // Toggle multi-select
    let current = userAnswers[q.globalId] || '';
    if (current.includes(letter)) {
      current = current.replace(letter, '');
    } else {
      current += letter;
      current = current.split('').sort().join('');
    }
    if (current) {
      userAnswers[q.globalId] = current;
    } else {
      delete userAnswers[q.globalId];
    }
  } else {
    userAnswers[q.globalId] = letter;
    // Auto-check for single choice with known answer
    if (q.answer) {
      setTimeout(() => checkAnswer(), 300);
      return;
    }
  }
  renderQuestion();
  saveState();
}

function checkAnswer() {
  const q = filteredQuestions[currentIndex];
  if (!q || isSelf(q.type)) return;

  const userAns = userAnswers[q.globalId];
  if (!userAns) {
    showToast('请先选择一个选项');
    return;
  }

  if (q.answer) {
    const correct = userAns === q.answer;
    if (correct) {
      document.getElementById('qBanner').textContent = '✅ 回答正确！';
      document.getElementById('qBanner').className = 'banner show ok';
      // Remove from wrong set if previously wrong
      wrongSet.delete(q.globalId);
      // Auto-advance to next question after a short beat
      setTimeout(() => nextQuestion(), 800);
    } else {
      document.getElementById('qBanner').textContent = '❌ 回答错误，正确答案是 ' + q.answer;
      document.getElementById('qBanner').className = 'banner show er';
      // Add to wrong set
      wrongSet.add(q.globalId);
    }
    // Show explanation if available
    if (q.explanation) {
      document.getElementById('qExplanationContent').textContent = q.explanation;
      document.getElementById('qExplanation').classList.add('show');
    }
  } else {
    document.getElementById('qBanner').textContent = '📝 已记录你的选择（本题答案待验证，请对照教材确认）';
    document.getElementById('qBanner').className = 'banner show info';
  }

  // Disable options
  document.querySelectorAll('.opt').forEach(o => {
    o.classList.add('disabled');
    if (q.answer) {
      const L = o.dataset.letter;
      const isC = q.type === 'single' ? (L === q.answer) : q.answer.includes(L);
      if (isC) o.classList.add('correct');
      else if (userAns && (q.type === 'single' ? (L === userAns) : userAns.includes(L))) o.classList.add('wrong');
    }
  });

  saveState();
  renderNavDots();
  updateProgress();
}

function toggleShortAnswer() {
  const q = filteredQuestions[currentIndex];
  if (!q || !isSelf(q.type)) return;

  const exp = document.getElementById('shortAnswerExp');
  if (exp.classList.contains('show')) {
    exp.classList.remove('show');
  } else {
    exp.classList.add('show');
    // Save that user viewed the answer
    const ta = document.querySelector('#qShortAnswer textarea');
    if (ta.value.trim()) {
      userAnswers[q.globalId] = ta.value.trim();
    }
    saveState();
    renderNavDots();
    updateProgress();
  }
}

// Auto-save short answer
document.addEventListener('input', function(e) {
  if (e.target.matches('#qShortAnswer textarea')) {
    const q = filteredQuestions[currentIndex];
    if (q && isSelf(q.type)) {
      userAnswers[q.globalId] = e.target.value;
      saveState();
      renderNavDots();
      updateProgress();
    }
  }
});

function toggleStar() {
  const q = filteredQuestions[currentIndex];
  if (!q) return;

  if (starredQuestions.has(q.globalId)) {
    starredQuestions.delete(q.globalId);
    showToast('已取消收藏');
  } else {
    starredQuestions.add(q.globalId);
    showToast('⭐ 已收藏');
  }
  renderQuestion();
  saveState();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
    saveState();
  }
}

function nextQuestion() {
  if (currentIndex < filteredQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
    saveState();
  }
}

// ========== NAV DOTS ==========
function renderNavDots() {
  const dotsDiv = document.getElementById('navDots');
  dotsDiv.innerHTML = filteredQuestions.map((q, i) => {
    let cls = 'nav-dot';
    if (i === currentIndex) cls += ' active';
    if (userAnswers[q.globalId] !== undefined) {
      if (q.answer && userAnswers[q.globalId] === q.answer) cls += ' done';
      else if (q.answer && userAnswers[q.globalId] !== q.answer) cls += ' wrong';
      else cls += ' done'; // Self-evaluated
    }
    if (starredQuestions.has(q.globalId)) cls += ' starred';
    return '<div class="' + cls + '" onclick="jumpTo(' + i + ')">' + q.id + '</div>';
  }).join('');
}

function jumpTo(index) {
  currentIndex = index;
  renderQuestion();
  saveState();
}

// ========== PROGRESS ==========
function updateProgress() {
  const total = filteredQuestions.length;
  const answered = filteredQuestions.filter(q => userAnswers[q.globalId] !== undefined).length;
  const pct = total > 0 ? Math.round(answered / total * 100) : 0;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = answered + '/' + total;
}

// ========== OPTIONS CLICK (event delegation) ==========
document.getElementById('qOptions').addEventListener('click', function(e) {
  const opt = e.target.closest('.opt');
  if (!opt) return;
  if (opt.classList.contains('disabled')) return;
  const letter = opt.dataset.letter;
  if (letter) selectOption(letter);
});

// ========== KEYBOARD ==========
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  const q = filteredQuestions[currentIndex];
  if (!q) return;

  if (q.type === 'single' && !userAnswers[q.globalId]) {
    const key = e.key.toUpperCase();
    if ('ABCD'.includes(key) && key < 'A' + q.options.length) {
      selectOption(key);
    }
  }

  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key === 'Enter') checkAnswer();
});

// ========== TOAST ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 1500);
}

// ========== PERSIST ==========
function saveState() {
  try {
    localStorage.setItem('ds_quiz_state', JSON.stringify({
      userAnswers: userAnswers,
      wrongSet: [...wrongSet],
      starred: [...starredQuestions],
      currentIndex: currentIndex,
      currentFilter: currentFilter
    }));
    updateDataPanel();
  } catch(e) {}
}

// ========== SHUFFLE ==========
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQuestions() {
  const base = currentFilter === 'all' ? ALL_QUESTIONS :
    currentFilter === 'wrong' ? ALL_QUESTIONS.filter(q => wrongSet.has(q.globalId)) :
    ALL_QUESTIONS.filter(q => q.type === currentFilter);

  filteredQuestions = shuffleArray([...base]);
  currentIndex = 0;
  renderQuestion();
  renderNavDots();
  updateProgress();
  showToast('🔀 题目已打乱');
  saveState();
}

// ========== DATA MANAGEMENT ==========
function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    userAnswers: userAnswers,
    wrongSet: [...wrongSet],
    starred: [...starredQuestions],
    currentIndex: currentIndex,
    currentFilter: currentFilter
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '数据结构总习题集-备份-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.userAnswers) { showToast('❌ 无效的数据文件'); return; }
      if (confirm('导入将覆盖当前数据，确定继续？\n导入数据包含 ' + Object.keys(data.userAnswers).length + ' 条答题记录')) {
        userAnswers = data.userAnswers;
        if (data.wrongSet) wrongSet = new Set(data.wrongSet);
        if (data.starred) starredQuestions = new Set(data.starred);
        if (data.currentIndex !== undefined) currentIndex = data.currentIndex;
        if (data.currentFilter) currentFilter = data.currentFilter;
        saveState();
        applyFilter(currentFilter);
        renderQuestion();
        renderNavDots();
        updateProgress();
        showToast('📥 数据已导入');
      }
    } catch(err) {
      showToast('❌ 文件解析失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showResetModal() {
  document.getElementById('resetModal').classList.add('show');
}

function hideResetModal() {
  document.getElementById('resetModal').classList.remove('show');
}

function resetAllData() {
  userAnswers = {};
  wrongSet = new Set();
  starredQuestions = new Set();
  currentIndex = 0;
  currentFilter = 'all';
  try { localStorage.removeItem('ds_quiz_state'); } catch(e) {}
  hideResetModal();
  applyFilter('all');
  renderQuestion();
  renderNavDots();
  updateProgress();
  updateDataPanel();
  showToast('🔄 数据已清除');
}

// ========== INIT ==========
function init() {
  // Restore filter
  applyFilter(currentFilter);
  // Auto-shuffle on first load
  filteredQuestions = shuffleArray([...filteredQuestions]);
  currentIndex = 0;
  renderQuestion();
  renderNavDots();
  updateProgress();
  updateDataPanel();
}

init();
</script>
